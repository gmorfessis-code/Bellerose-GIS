/* Collapsible section arrows - inside the header */
details summary {
    list-style: none;
    position: relative;
    padding-left: 25px !important; /* Force padding for arrow space */
}

details summary::-webkit-details-marker {
    display: none;
}

details summary::before {
    content: '▶';
    position: absolute;
    left: 8px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 10px;
    font-weight: bold;
}

details[open] summary::before {
    content: '▼';
}

/* Ensure arrow inherits color from section */
.leaflet-popup-content details summary::before {
    color: inherit;
}


html, body, #map {

}

/* Mobile Responsive Styles */
@media (max-width: 768px) {
    .filter-panel {
        top: 10px;
        left: 10px;
        right: 10px;
        padding: 8px;
    }
    
    .filter-panel h4 {
        font-size: 12px;
        margin-bottom: 6px;
    }
    
    .filter-btn {
        padding: 6px 10px;
        font-size: 11px;
        margin-bottom: 4px;
    }
    
    /* Make popup more mobile-friendly */
    .leaflet-popup-content-wrapper {
        max-width: 90vw !important;
    }
    
    .leaflet-popup-content {
        margin: 8px !important;
    }
    
    /* Adjust map controls for mobile */
    .leaflet-control-zoom {
        margin-top: 150px !important;
    }
    
    .leaflet-control-layers {
        margin-top: 10px !important;
    }
}

@media (max-width: 480px) {
    /* Extra small screens */
    .filter-panel {
        font-size: 11px;
    }
    
    .leaflet-popup-content-wrapper {
        font-size: 11px;
    }
}

/* Improve touch targets on mobile */
@media (hover: none) and (pointer: coarse) {
    .filter-btn {
        min-height: 44px; /* Apple's recommended touch target */
    }
    
    details summary {
        min-height: 44px;
        display: flex;
        align-items: center;
    }
}

        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.update();
                    }, 10);
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {

                        popup.update();
                    });

                        popup.setContent(tempDiv.innerHTML);

                    }, 10);

// ══════════════════════════════════════════════════════════════
//  200-FT RADIUS TOOL
//  Finds all parcels within 200ft of a searched SBL or address.
//  Results list with owner info + print/export capability.
// ══════════════════════════════════════════════════════════════

var radiusCircle = [];
var radiusHighlightedLayers = [];
var radiusSubjectLayer = null;
var RADIUS_FT = 200;
var RADIUS_M  = RADIUS_FT * 0.3048;   // convert feet → metres for Leaflet

// ── Build the Leaflet control ────────────────────────────────
var RadiusControl = L.Control.extend({
    options: { position: 'topleft' },
    onAdd: function(map) {
        var container = L.DomUtil.create('div', 'radius-control leaflet-bar');
        container.innerHTML =
            '<div class="radius-control-header" onclick="toggleRadiusPanel()">' +

                '<span id="radius-toggle-arrow" style="margin-left:auto;">▼</span>' +
            '</div>' +
            '<div class="radius-control-body" id="radius-panel-body">' +
                '<div class="radius-hint">Enter an SBL (e.g. 32-44-55) or a street address to find all parcels within 200 ft.</div>' +
                '<div class="radius-input-row">' +
                    '<input type="text" id="radius-search-input" placeholder="SBL or address..." ' +
                           'onkeydown="if(event.key===\'Enter\')runRadiusSearch()" />' +
                    '<button class="radius-btn" onclick="runRadiusSearch()">Search</button>' +
                    '<button class="radius-btn clear-btn" onclick="clearRadiusSearch()" title="Clear">✕</button>' +
                '</div>' +
                '<div id="radius-status" style="font-size:11px;color:#888;min-height:14px;"></div>' +
                '<div class="radius-results" id="radius-results-panel">' +
                    '<div class="radius-results-header">' +
                        '<span class="radius-results-title" id="radius-results-title"></span>' +
                        '<button class="radius-print-btn" onclick="printRadiusResults()">🖨 Print</button>' +
                        '<button class="radius-print-btn" onclick="exportRadiusCSV()" style="margin-left:4px;background:linear-gradient(135deg,#1a5490 0%,#2d7ab8 100%);">⬇ CSV</button>' +
                    '</div>' +
                    '<div class="radius-results-list" id="radius-results-list"></div>' +
                '</div>' +
            '</div>';
        L.DomEvent.disableClickPropagation(container);
        L.DomEvent.disableScrollPropagation(container);
        return container;
    }
});
map.addControl(new RadiusControl());

function toggleRadiusPanel() {
    var body  = document.getElementById('radius-panel-body');
    var arrow = document.getElementById('radius-toggle-arrow');
    if (body.style.display === 'none') {
        body.style.display = 'block';

    } else {
        body.style.display = 'none';

}

// ── Helper: build SBL string from feature properties ────────
function buildSBL(props) {
    var suffix = (props.T_LOT_SUFFIX && props.T_LOT_SUFFIX !== '0') ? props.T_LOT_SUFFIX : '';
    return props.T_SECTION + '-' + props.T_BLOCK + '-' + props.T_LOT_NUMBER_PREF + suffix;
}

// ── Helper: build display address from feature properties ───
function buildAddr(props) {
    var num = props.PARCEL_STREET_NUMBER || '';
    if (num.toLowerCase().includes('no') || num.includes('#')) num = '';
    var suffixMap = { 'Blvd':'Boulevard','Ln':'Lane','Rd':'Road','Tpke':'Turnpike' };
    var sfx = props.PARCEL_SUFFIX ? (suffixMap[props.PARCEL_SUFFIX] || props.PARCEL_SUFFIX) : '';
    return [num, props.PARCEL_STREET || '', sfx, props.PARCEL_CITY || ''].filter(Boolean).join(' ');
}

// ── Reset all radius highlights ──────────────────────────────
function clearRadiusSearch() {
    // Remove circles
    radiusCircle.forEach(function(c) { map.removeLayer(c); });
    radiusCircle = [];
    // Restore highlighted parcel styles
    radiusHighlightedLayers.forEach(function(l) {
        var isSplit = l.feature.properties.T_VILLAGE_PCT_1 < 100;
        l.setStyle({
            opacity: 1,
            color: isSplit ? 'rgba(255,193,7,1.0)' : 'rgba(166,206,227,1.0)',
            weight: 2.0,
            fillOpacity: isSplit ? 0.2 : 0.15,
            fillColor: isSplit ? '#ffc107' : '#7eb3d4'
        });
    });
    radiusHighlightedLayers = [];
    radiusSubjectLayer = null;
    // Hide results panel
    document.getElementById('radius-results-panel').style.display = 'none';
    document.getElementById('radius-results-list').innerHTML = '';
    document.getElementById('radius-status').textContent = '';
    document.getElementById('radius-search-input').value = '';
}

// ── Main search function ─────────────────────────────────────
function runRadiusSearch() {
    var query = (document.getElementById('radius-search-input').value || '').trim().toUpperCase();
    if (!query) {
        document.getElementById('radius-status').textContent = 'Please enter an SBL or address.';
        return;
    }

    clearRadiusSearch();
    document.getElementById('radius-status').textContent = 'Searching…';

    var subjectCenter = null;
    var subjectProps  = null;
    var isSBLQuery = /^\d/.test(query) && query.indexOf('-') > -1;

    // ── Find the subject parcel ──────────────────────────────
    layer_BelleroseVillageParcelsFinalVersionbellerose_village_parcels_final_version_2.eachLayer(function(lyr) {
        if (subjectCenter) return;   // already found
        var props = lyr.feature.properties;
        var sbl   = buildSBL(props).toUpperCase();
        var addr  = buildAddr(props).toUpperCase();

        var match = false;
        if (isSBLQuery) {
            match = (sbl === query);
        } else {
            // Address search: check if query is contained in address
            match = (addr.indexOf(query) > -1);
        }

        if (match) {
            subjectCenter = lyr.getBounds().getCenter();
            subjectProps  = props;
            radiusSubjectLayer = lyr;
        }
    });

    if (!subjectCenter) {
        document.getElementById('radius-status').textContent = 'No parcel found for "' + query + '". Check SBL format (e.g. 32-44-55) or address.';
        return;
    }

    // ── Extract subject parcel corners ───────────────────────
    // Use every vertex of the subject parcel as a radius origin point.
    // This matches the Buildings Inspector methodology: 200ft is measured
    // from the furthest extent of the subject parcel, not just its centroid.
    var subjectVertices = [];
    var subjectGeom = radiusSubjectLayer.feature.geometry;
    var subjectRings = subjectGeom.type === 'Polygon'
        ? subjectGeom.coordinates
        : subjectGeom.coordinates.reduce(function(acc, poly) { return acc.concat(poly); }, []);

    subjectRings.forEach(function(ring) {
        ring.forEach(function(coord) {
            subjectVertices.push(L.latLng(coord[1], coord[0]));
        });
    });
    // Also include centroid as a fallback
    subjectVertices.push(subjectCenter);

    // ── Draw circles from each corner ────────────────────────
    // Show one dashed circle per corner vertex so staff can see
    // the full swept area. Use low opacity so they don't clutter.
    subjectVertices.forEach(function(vertex) {
        var c = L.circle(vertex, {
            radius: RADIUS_M,
            color: '#d32f2f',
            weight: 1.5,
            dashArray: '5 4',
            fillColor: '#ef9a9a',
            fillOpacity: 0.04
        }).addTo(map);
        radiusCircle.push(c);
    });

    // Pan map to subject parcel
    map.panTo(subjectCenter);

    // ── Geometry intersection helpers ────────────────────────
    // Returns the minimum distance in metres from a LatLng point
    // to a polygon ring (array of LatLng vertices).
    function distPointToRingM(pt, ring) {
        var minDist = Infinity;
        for (var i = 0; i < ring.length; i++) {
            var a = ring[i];
            var b = ring[(i + 1) % ring.length];
            // Distance from pt to segment a→b
            var d = distPointToSegmentM(pt, a, b);
            if (d < minDist) minDist = d;
        }
        return minDist;
    }

    function distPointToSegmentM(p, a, b) {
        // Work in simple lat/lng space — small area so distortion is negligible
        var dx = b.lng - a.lng, dy = b.lat - a.lat;
        var lenSq = dx*dx + dy*dy;
        var t = lenSq > 0
            ? Math.max(0, Math.min(1, ((p.lng-a.lng)*dx + (p.lat-a.lat)*dy) / lenSq))
            : 0;
        var nearLng = a.lng + t*dx, nearLat = a.lat + t*dy;
        return p.distanceTo(L.latLng(nearLat, nearLng));
    }

    // Returns { intersects: bool, partial: bool, minDistFt: number }
    // Tests the candidate parcel against ALL subject parcel vertices.
    // A parcel qualifies if ANY vertex of the subject is within 200ft of
    // ANY point on the candidate parcel boundary or interior.
    function circleIntersectsParcel(subjectVerts, radiusM, lyr) {
        var geom  = lyr.feature.geometry;
        var rings = [];

        if (geom.type === 'Polygon') {
            rings = geom.coordinates;
        } else if (geom.type === 'MultiPolygon') {
            geom.coordinates.forEach(function(poly) { rings = rings.concat(poly); });
        }

        var llRings = rings.map(function(ring) {
            return ring.map(function(c) { return L.latLng(c[1], c[0]); });
        });

        var overallMinDistM = Infinity;
        var centroidInside  = false;
        var edgeInside      = false;

        // Test each subject vertex as a circle origin
        for (var vi = 0; vi < subjectVerts.length; vi++) {
            var origin = subjectVerts[vi];

            // 1. Candidate centroid inside this circle?
            var centroid  = lyr.getBounds().getCenter();
            var centDistM = origin.distanceTo(centroid);
            if (centDistM < overallMinDistM) overallMinDistM = centDistM;
            if (centDistM <= radiusM) { centroidInside = true; break; }

            // 2. Any candidate vertex inside this circle?
            var vertexHit = false;
            for (var r = 0; r < llRings.length; r++) {
                for (var v = 0; v < llRings[r].length; v++) {
                    var d = origin.distanceTo(llRings[r][v]);
                    if (d < overallMinDistM) overallMinDistM = d;
                    if (d <= radiusM) { vertexHit = true; break; }
                }
                if (vertexHit) break;
            }
            if (vertexHit) { edgeInside = true; break; }

            // 3. Closest point on any candidate edge inside this circle?
            for (var r2 = 0; r2 < llRings.length; r2++) {
                var edgeDist = distPointToRingM(origin, llRings[r2]);
                if (edgeDist < overallMinDistM) overallMinDistM = edgeDist;
                if (edgeDist <= radiusM) { edgeInside = true; break; }
            }
            if (edgeInside) break;
        }

        if (!centroidInside && !edgeInside) {
            return { intersects: false, partial: false, minDistFt: Math.round(overallMinDistM / 0.3048) };
        }

        // partial = edge/vertex hit but centroid outside
        return {
            intersects: true,
            partial:    !centroidInside,
            minDistFt:  Math.round(overallMinDistM / 0.3048)
        };
    }

    // ── Find parcels within radius ───────────────────────────
    var results = [];    // { props, center, layer, isSubject, partial, distFt }

    layer_BelleroseVillageParcelsFinalVersionbellerose_village_parcels_final_version_2.eachLayer(function(lyr) {
        var isSelf = (lyr === radiusSubjectLayer);
        if (isSelf) {
            var c = lyr.getBounds().getCenter();
            results.push({ props: lyr.feature.properties, center: c, layer: lyr, isSubject: true, partial: false, distFt: 0 });
            lyr.setStyle({ fillColor: '#ffc107', fillOpacity: 0.6, color: '#e65100', weight: 3 });
            radiusHighlightedLayers.push(lyr);
            return;
        }

        var hit = circleIntersectsParcel(subjectVertices, RADIUS_M, lyr);
        if (!hit.intersects) return;

        results.push({
            props:     lyr.feature.properties,
            center:    lyr.getBounds().getCenter(),
            layer:     lyr,
            isSubject: false,
            partial:   hit.partial,
            distFt:    hit.minDistFt
        });

        if (hit.partial) {
            // Purple for partial intersect
            lyr.setStyle({ fillColor: '#9c27b0', fillOpacity: 0.45, color: '#6a1b9a', weight: 2.5 });
        } else {
            // Red for fully within
            lyr.setStyle({ fillColor: '#ef5350', fillOpacity: 0.45, color: '#b71c1c', weight: 2.5 });
        }
        radiusHighlightedLayers.push(lyr);
    });

    // Sort: subject first, then by distance
    results.sort(function(a, b) {
        if (a.isSubject) return -1;
        if (b.isSubject) return  1;
        return a.distFt - b.distFt;
    });

    var nearbyCount  = results.filter(function(r) { return !r.isSubject; }).length;
    var partialCount = results.filter(function(r) { return r.partial; }).length;
    var statusText   = nearbyCount + ' parcel' + (nearbyCount !== 1 ? 's' : '') + ' within 200 ft';
    if (partialCount > 0) statusText += ' (' + partialCount + ' partial intersect' + (partialCount !== 1 ? 's' : '') + ')';
    document.getElementById('radius-status').textContent = statusText + '.';

    // ── Render results list ──────────────────────────────────
    document.getElementById('radius-results-title').textContent =
        '200 ft Radius — ' + nearbyCount + ' adjacent parcel' + (nearbyCount !== 1 ? 's' : '');

    var listEl = document.getElementById('radius-results-list');
    listEl.innerHTML = '';

    if (results.length === 0) {
        listEl.innerHTML = '<div class="radius-no-results">No parcels found within 200 ft.</div>';
    } else {
        results.forEach(function(r) {
            var sbl   = buildSBL(r.props);
            var addr  = buildAddr(r.props);
            var owner = r.props.BV_OWNER || r.props.COUNTY_OWNER_2025 || '';
            var dist  = r.isSubject ? 'Subject Parcel' : r.distFt + ' ft' + (r.partial ? ' (partial)' : '');

            var item = document.createElement('div');
            item.className = 'radius-result-item' + (r.isSubject ? ' radius-result-subject' : (r.partial ? ' radius-result-partial' : ''));
            item.innerHTML =
                '<div><span class="r-sbl">' + sbl + '</span>' +
                (r.partial ? ' <span style="background:#9c27b0;color:white;font-size:9px;padding:1px 5px;border-radius:3px;font-weight:700;">PARTIAL</span>' : '') +
                ' <span style="color:#aaa;font-size:10px;">(' + (r.isSubject ? 'Subject' : r.distFt + ' ft') + ')</span></div>' +
                '<div class="r-addr">' + addr + '</div>' +
                (owner ? '<div class="r-owner">' + owner + '</div>' : '');

            // Click item → pan map to that parcel
            (function(center, lyr) {
                item.addEventListener('click', function() {
                    map.panTo(center);
                    lyr.openPopup();
                });
            })(r.center, r.layer);

            listEl.appendChild(item);
        });
    }

    document.getElementById('radius-results-panel').style.display = 'block';

    // Store results for printing
    window._radiusResults = results;
    window._radiusQuery   = query;
}

// ── Print / Export ───────────────────────────────────────────
function printRadiusResults() {
    if (!window._radiusResults || window._radiusResults.length === 0) return;

    var now    = new Date().toLocaleDateString();
    var rows   = '';
    var count  = 0;

    window._radiusResults.forEach(function(r) {
        var sbl   = buildSBL(r.props);
        var addr  = buildAddr(r.props);
        var owner = r.props.BV_OWNER || r.props.COUNTY_OWNER_2025 || '';
        var ownerAddr = '';
        if (r.props.BV_OWNER_ADDRESS) ownerAddr = r.props.BV_OWNER_ADDRESS;
        if (r.props.BV_OWNER_CSZ) ownerAddr += (ownerAddr ? ', ' : '') + r.props.BV_OWNER_CSZ;
        var dist  = r.isSubject ? 'Subject Parcel' : r.distFt + ' ft' + (r.partial ? ' ⬡ partial' : '');
        var bg    = r.isSubject ? '#fff8e1' : (count % 2 === 0 ? '#ffffff' : '#f5f5f5');
        if (!r.isSubject) count++;

        rows += '<tr style="background:' + bg + ';">' +

// ── CSV Export ───────────────────────────────────────────────
function exportRadiusCSV() {
    if (!window._radiusResults || window._radiusResults.length === 0) return;

    var now = new Date().toLocaleDateString('en-US').replace(/\//g, '-');

    // CSV helper — wraps a value in quotes and escapes any internal quotes
    function q(val) {
        var s = (val === null || val === undefined) ? '' : String(val);
        return '"' + s.replace(/"/g, '""') + '"';
    }

    var lines = [];

    // Header row — columns useful for label merge
    lines.push([
        'SBL',
        'Property_Address',
        'City',
        'State',
        'ZIP',
        'Owner_Name',
        'Owner_Name_2',
        'Mailing_Address',
        'Mailing_City',
        'Mailing_State',
        'Mailing_ZIP',
        'Distance_Ft',
        'Partial_Intersect',
        'Subject_Parcel'
    ].join(','));

    window._radiusResults.forEach(function(r) {
        var p = r.props;

        // Property address parts
        var streetNum = p.PARCEL_STREET_NUMBER || '';
        if (streetNum.toLowerCase().includes('no') || streetNum.includes('#')) streetNum = '';
        var suffixMap = { 'Blvd':'Boulevard','Ln':'Lane','Rd':'Road','Tpke':'Turnpike' };
        var sfx = p.PARCEL_SUFFIX ? (suffixMap[p.PARCEL_SUFFIX] || p.PARCEL_SUFFIX) : '';
        var propAddr = [streetNum, p.PARCEL_STREET || '', sfx].filter(Boolean).join(' ');

        // Owner mailing address — split into components for label merge
        // BV_OWNER_CSZ is typically "City, ST  ZIP" — parse it out
        var mailingCity = '', mailingState = '', mailingZIP = '';
        var csz = p.BV_OWNER_CSZ || '';
        var cszMatch = csz.match(/^(.*),\s*([A-Z]{2})\s+(\d{5}(?:-\d{4})?)$/);
        if (cszMatch) {
            mailingCity  = cszMatch[1].trim();
            mailingState = cszMatch[2].trim();
            mailingZIP   = cszMatch[3].trim();
        } else if (csz) {
            mailingCity = csz;  // fallback — put whole value in city
        }

        lines.push([
            q(buildSBL(p)),
            q(propAddr),
            q(p.PARCEL_CITY || ''),
            q((p.PARCEL_STATE || '').toUpperCase()),
            q(p.PARCEL_ZIP || ''),
            q(p.BV_OWNER || p.COUNTY_OWNER_2025 || ''),
            q(p.BV_OWNER_CAREOF || ''),
            q(p.BV_OWNER_ADDRESS || ''),
            q(mailingCity),
            q(mailingState),
            q(mailingZIP),
            q(r.isSubject ? '0' : String(r.distFt)),
            q(r.partial ? 'Yes' : 'No'),
            q(r.isSubject ? 'Yes' : 'No')
        ].join(','));
    });

    var csvContent = lines.join('\r\n');
    var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    var url  = URL.createObjectURL(blob);
    var a    = document.createElement('a');
    a.href     = url;
    a.download = 'Bellerose_200ft_Radius_' + (window._radiusQuery || 'search').replace(/[^a-zA-Z0-9-]/g,'_') + '_' + now + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}
